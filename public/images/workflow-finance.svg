<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Alur Personal Finance Telegram Bot</title><desc id="desc">Pesan Telegram diproses bot, masuk ke Google Sheets, lalu ditampilkan pada dashboard.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#101d3c"/><stop offset="1" stop-color="#172b58"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#315efb"/><stop offset="1" stop-color="#6f8cff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071126" flood-opacity=".35"/></filter></defs>
  <rect width="1600" height="700" rx="28" fill="url(#bg)"/><path d="M0 580h1600" stroke="#ffffff" opacity=".06"/><path d="M0 150h1600" stroke="#ffffff" opacity=".04"/>
  <text x="90" y="92" fill="#9fb4ff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">PERSONAL FINANCE BOT</text><text x="90" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Dari chat singkat menjadi catatan keuangan rapi</text>
  <g filter="url(#shadow)"><rect x="90" y="235" width="300" height="245" rx="20" fill="#fff"/><rect x="485" y="235" width="300" height="245" rx="20" fill="#fff"/><rect x="880" y="235" width="300" height="245" rx="20" fill="#fff"/><rect x="1275" y="235" width="235" height="245" rx="20" fill="#fff"/></g>
  <g font-family="Arial,sans-serif"><circle cx="140" cy="285" r="24" fill="#e6f3ff"/><text x="132" y="294" fill="#198dcc" font-size="24">✈</text><text x="90" y="345" fill="#172033" font-size="25" font-weight="700">Telegram</text><text x="90" y="380" fill="#657084" font-size="19">Kirim transaksi</text><rect x="90" y="410" width="215" height="37" rx="9" fill="#edf3ff"/><text x="105" y="435" fill="#315efb" font-size="16">“Makan siang 35.000”</text>
  <circle cx="535" cy="285" r="24" fill="#eef4ff"/><text x="526" y="294" fill="#315efb" font-size="23">✦</text><text x="485" y="345" fill="#172033" font-size="25" font-weight="700">Bot memproses</text><text x="485" y="380" fill="#657084" font-size="19">Baca &amp; kelompokkan</text><path d="M485 418h220" stroke="#dfe5ef"/><circle cx="495" cy="441" r="5" fill="#315efb"/><text x="510" y="447" fill="#53617a" font-size="16">Kategori: Food</text>
  <circle cx="930" cy="285" r="24" fill="#e9f8ee"/><text x="921" y="294" fill="#28a268" font-size="23">✓</text><text x="880" y="345" fill="#172033" font-size="25" font-weight="700">Google Sheets</text><text x="880" y="380" fill="#657084" font-size="19">Data tersimpan otomatis</text><rect x="880" y="410" width="220" height="37" rx="9" fill="#ecf8f0"/><text x="895" y="435" fill="#218555" font-size="16">Row baru ditambahkan</text>
  <circle cx="1325" cy="285" r="24" fill="#eef3ff"/><text x="1317" y="294" fill="#315efb" font-size="23">↗</text><text x="1275" y="345" fill="#172033" font-size="25" font-weight="700">Dashboard</text><text x="1275" y="380" fill="#657084" font-size="19">Pantau ringkasan</text><rect x="1275" y="410" width="170" height="37" rx="9" fill="#315efb"/><text x="1292" y="435" fill="#fff" font-size="16">Lihat laporan</text></g>
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"><path d="M400 357h65"/><path d="M795 357h65"/><path d="M1190 357h65"/></g><g fill="#6f8cff"><path d="m458 347 18 10-18 10z"/><path d="m853 347 18 10-18 10z"/><path d="m1248 347 18 10-18 10z"/></g>
  <text x="90" y="610" fill="#b9c6e4" font-family="Arial,sans-serif" font-size="18">Input sekali lewat Telegram → data rapi → insight yang mudah dipantau.</text>
</svg>
